<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STPS Result Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Poppins', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
  .container {
        background: white;
        padding: 35px;
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 480px;
        animation: fadeIn 0.8s;
    }


}
    @keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

  .school { text-align:center; margin-bottom: 15px; }
   .school { text-align:center; margin-bottom: 15px; }
    .logo {
    width: 90px;
    height: 90px;
    border-radius: 50%; /* Gol logo ke liye */
    margin-bottom: 10px;
    object-fit: cover;
    border: 3px solid #764ba2;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.school h1 { color: #764ba2; font-size: 22px; font-weight: 700; }


  .school h1 { color: #764ba2; font-size: 22px; font-weight: 700; }
  .school p { color: #777; font-size: 14px; }

    h2 { text-align: center; color: #333; margin-bottom: 20px; font-size: 24px; }

   .row { display: flex; gap: 10px; }
    select, input {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border: 2px solid #ddd;
        border-radius: 12px;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
        background: white;
    }
    select:focus, input:focus { border-color: #667eea; box-shadow: 0 0 8px rgba(102,126,234,0.3); }

    button {
        width: 100%;
        padding: 16px;
        margin: 15px 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }

   /* NEW ATTRACTIVE RESULT CARD */
  .result {
        margin-top: 20px;
        padding: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 18px;
        display: none;
        text-align: center;
        animation: fadeIn 0.5s;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(102,126,234,0.4);
    }
   .result-header {
        background: white;
        padding: 15px;
        color: #764ba2;
        font-weight: 700;
        font-size: 18px;
    }
   .result-body {
        padding: 25px;
        color: white;
    }
  .subject-tag {
        display: inline-block;
        background: rgba(255,255,255,0.2);
        color: white;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 14px;
        margin-bottom: 12px;
        border: 1px solid rgba(255,255,255,0.3);
    }
  .marks { font-size: 50px; font-weight: bold; margin: 10px 0; }
  .pass { color: #a8ffb0; font-weight: bold; font-size: 22px; }
  .fail { color: #ffb3b3; font-weight: bold; font-size: 22px; }
  .error { color: #dc3545; text-align: center; font-weight: bold; padding: 15px; background: #ffecec; border-radius: 12px; margin-top: 10px; }

        <p>HANSI</p>
    </div>
    <h2>📊 Student Result Portal</h2>

    <div class="row">
        <select id="class">
            <option value="">-- Select Class --</option>
            <option value="1">Class 1</option>
            <option value="2">Class 2</option>
            <option value="3">Class 3</option>
            <option value="4">Class 4</option>
            <option value="5">Class 5</option>
            <option value="6">Class 6</option>
            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
            <option value="11">Class 11</option>
            <option value="12">Class 12</option>
        </select>

        <select id="subject">
            <option value="">-- Subject --</option>
            <option value="COMPUTER">COMPUTER</option>
            <option value="MATHS">MATHS</option>
            <option value="SCIENCE">SCIENCE</option>
            <option value="ENGLISH">ENGLISH</option>
            <option value="HINDI">HINDI</option>
            <option value="SOCIAL SCIENCE">SOCIAL SCIENCE</option>
        </select>
    </div>

    <input type="text" id="name" placeholder="Enter Your Name">
    <input type="text" id="roll" placeholder="Enter Your Roll no.">
    <button onclick="checkResult()">See Your Result</button>

    <div id="resultBox" class="result"></div>
</div>

<script>
let students = {}; // Khali kar diya

// 1. YAHAN APNA GOOGLE SHEET KA CSV LINK DALO
let sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzVdeS9XazvzjrGvEHrVddtAGqw0q-2RfzotpK03YBix_6kmjDNp3i4k1W2uk_gwh3qPE7UQitv2cO/pub?output=csv";

// 2. PAGE LOAD HOTE HI SHEET SE DATA LOAD HOGA
async function loadData() {
    document.getElementById('resultBox').innerHTML = `<p style="text-align:center;color:#764ba2">Data load ho raha hai...</p>`;
    document.getElementById('resultBox').style.display = 'block';

    try{
        let res = await fetch(sheetURL);
        let data = await res.text();
        let rows = data.split("\n").slice(1); // header skip

        rows.forEach(row => {
            if(row.trim() === "") return;
            let [cls, subject, name, roll, marks, maxMarks] = row.split(",");

            if(!students[cls]) students[cls] = {};
            if(!students[cls][subject]) students[cls][subject] = [];

            students[cls][subject].push({
                name: name.trim(),
                roll: roll.trim(),
                marks: parseInt(marks),
                maxMarks: parseInt(maxMarks) // Kitne me se
            });
        });
        document.getElementById('resultBox').style.display = 'none';
    }catch(err){
        document.getElementById('resultBox').innerHTML = `<p class="error">⚠️ The sheet didn't load. Check if the link is public or not.
</p>`;
    }
}

loadData(); // Auto call

// 3. TUMHARA checkResult FUNCTION - THODA UPDATE
function checkResult() {
    let cls = document.getElementById('class').value;
    let subject = document.getElementById('subject').value;
    let name = document.getElementById('name').value.trim().toLowerCase();
    let roll = document.getElementById('roll').value.trim();
    let resultBox = document.getElementById('resultBox');

    if(cls === "" || subject === "" || name === "" || roll === ""){
        resultBox.style.display = 'block';
        resultBox.className = 'error';
        resultBox.innerHTML = `<p class="error">⚠️ Fill in all the details.</p>`;
        return;
    }
    resultBox.className = 'result';

    if(!students[cls] ||!students[cls][subject]){
        resultBox.style.display = 'block';
        resultBox.innerHTML = `<div class="result-header">No Data</div><div class="result-body"><p class="error">❌ Data for this class-subject is not available.</p></div>`;
        return;
    }

    let studentList = students[cls][subject];
    let student = studentList.find(s => s.name.toLowerCase() === name && s.roll === roll);

    if(student) {
        let per = ((student.marks/student.maxMarks)*100).toFixed(2);
        let status = student.marks >= (student.maxMarks/2)? "Pass ✅" : "FAIL ❌";
        let statusClass = student.marks >= (student.maxMarks/2)? "pass" : "fail";

        resultBox.style.display = 'block';
        resultBox.innerHTML = `
            <div class="result-header">🎉 Result Found - Class ${cls}</div>
            <div class="result-body">
                <span class="subject-tag">${subject}</span>
                <p><b>Name:</b> ${student.name}</p>
                <p><b>Roll no:</b> ${student.roll}</p>
                <p class="marks">${student.marks} / ${student.maxMarks}</p> <!-- YAHAN /40 KI JAGAH /maxMarks -->
                <p><b>Percentage:</b> ${per}%</p>
                <p class="${statusClass}">${status}</p>
            </div>
        `;
    } else {
        resultBox.style.display = 'block';
        resultBox.innerHTML = `<div class="result-header">Not Found</div><div class="result-body"><p class="error">❌ The name and roll number are incorrect.</p></div>`;
    }
}
</script>
