<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBHASH TAYAL PUBLIC SCHOOL - RESULT PORTAL</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#eef2ff;padding:15px}
.container{max-width:500px;margin:auto}
.header{background:linear-gradient(135deg,#0f2a5a,#2563eb);color:white;padding:20px;border-radius:15px;text-align:center;margin-bottom:15px}
.header h1{font-size:15px;line-height:1.2}
.header h2{font-size:19px;margin-top:5px}
.card{background:white;padding:20px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
input,select{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;margin-bottom:10px;outline:none;font-size:14px}
input:focus,select:focus{border-color:#2563eb}
.btn{width:100%;padding:13px;background:#0f2a5a;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
.result{margin-top:15px;display:none}
.result-head{background:#0f2a5a;color:white;padding:12px 15px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center}
.marksheet{background:white;border-radius:0 0 12px 12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f1f5f9;padding:10px 15px;text-align:left;font-size:12px}
td{padding:10px 15px;border-top:1px solid #f1f5f9;font-size:13px}
.total-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px;background:#f8fafc}
.box{background:white;padding:12px;border-radius:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.box h3{color:#0f2a5a;font-size:18px}
.box p{font-size:11px;color:#64748b}
.error{background:#fef2f2;color:#991b1b;padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none;text-align:center}
.status{font-size:12px;text-align:center;padding:8px;border-radius:8px;margin-bottom:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
     <h1>SUBHASH TAYAL PUBLIC SCHOOL, HANSI</h1>
    <h2>📚 RESULT PORTAL Sep-2026-27</h2>
    <p style="font-size:12px;margin-top:5px;opacity:.9">Please enter your Name / Class / Roll No.</p>
  </div>

  <div class="card">
    <div class="status" id="status" style="background:#eff6ff;color:#1e40af">⏳ Loading data from your Google Sheet...</div>

    <input type="text" id="name" placeholder="Student Name (Ex: Rahul)">
    <select id="class">
      <option value="">Class Select Karo</option>
      <option>6th</option><option>7th</option><option>8th</option>
      <option>9th</option><option>10th</option><option>11th</option><option>12th</option>
    </select>
    <input type="text" id="roll" placeholder="Roll No (Ex: 101)">

    <button class="btn" onclick="checkResult()">Check Result</button>
    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="result-head">
        <span id="rName">Rahul Sharma</span>
        <span id="rPass" style="background:#10b981;padding:4px 10px;border-radius:15px;font-size:11px">PASS</span>
      </div>
      <div class="marksheet">
        <table>
          <thead><tr><th>Subject</th><th>Marks</th></tr></thead>
          <tbody id="marksBody"></tbody>
        </table>
        <div class="total-box">
          <div class="box"><h3 id="tMarks">0/500</h3><p>TOTAL MARKS</p></div>
          <div class="box"><h3 id="tPer">0%</h3><p>PERCENTAGE</p></div>
        </div>
      </div>
      <button class="btn" style="margin-top:10px;background:white;color:#0f2a5a;border:2px dashed #2563eb" onclick="window.print()">🖨️ Print Karo</button>
    </div>
  </div>
</div>

<script>
// TUMHARI GOOGLE SHEET KA NAYA LINK
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzVdeS9XazvzjrGvEHrVddtAGqw0q-2RfzotpK03YBix_6kmjDNp3i4k1W2uk_gwh3qPE7UQitv2cO/pub?output=csv";

let students = [];

async function loadSheet(){
  try{
    // CORS Block se bachne ke liye Proxy use kar rahe hain
    const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(SHEET_URL);
    let res = await fetch(proxyUrl);
    let text = await res.text();

    if(text.includes("<!DOCTYPE html>") || text.includes("Sorry")){
        throw new Error("Sheet not published");
    }

    let rows = text.trim().split("\n");
    let headers = rows[0].split(",").map(h=>h.replace(/"/g,"").trim());

    students = [];
    for(let i=1; i<rows.length; i++){
      if(!rows[i].trim()) continue;
      let cols = rows[i].split(",").map(c=>c.replace(/"/g,"").trim());
      let obj = {};
      headers.forEach((h,j)=> obj[h] = cols[j] || "");

      let marks = {};
      for(let k in obj){
        if(!["Name","Class","Roll"].includes(k) && k!="" && obj[k]!="" &&!isNaN(Number(obj[k]))){
          marks[k] = Number(obj[k]);
        }
      }
      if(obj.Name){
        students.push({ name: obj.Name.trim(), class: String(obj.Class).trim(), roll: String(obj.Roll).trim(), marks: marks });
      }
    }
    let status = document.getElementById("status");
    status.innerHTML = "✅ Live Connected: " + students.length + " Students ka Data Ready Hai";
    status.style.background = "#d1fae5";
    status.style.color = "#065f46";
  }catch(e){
    let status = document.getElementById("status");
    status.innerHTML = "❌ Sheet failed to load - Please check if it's Published";
    status.style.background = "#fee2e2";
    status.style.color = "#991b1b";
    console.log(e);
  }
}

function checkResult(){
  let n = document.getElementById("name").value.toLowerCase().trim();
  let c = document.getElementById("class").value.trim();
  let r = document.getElementById("roll").value.trim();
  let err = document.getElementById("error");
  let resDiv = document.getElementById("result");

  if(!n ||!c ||!r){
    err.style.display="block"; err.innerText="Teeno Box Bharna Zaruri Hai!"; resDiv.style.display="none"; return;
  }

  let found = students.find(s => s.name.toLowerCase().includes(n) && s.class.toLowerCase() == c.toLowerCase() && s.roll == r);

  if(!found){
    err.style.display="block"; err.innerText="Result Nahi Mila! Sheet me Name/Class/Roll Check Karo";
    resDiv.style.display="none"; return;
  }

  err.style.display="none";
  document.getElementById("rName").innerText = found.name + " (" + found.class + ")";

  let tbody = document.getElementById("marksBody");
  tbody.innerHTML = "";
  let total = 0; let max = 0;
  for(let sub in found.marks){
    let m = found.marks[sub];
    total += m; max += 100;
    tbody.innerHTML += `<tr><td>${sub}</td><td>${m} / 100</td></tr>`;
  }

  document.getElementById("tMarks").innerText = total + " / " + max;
  let per = max > 0? ((total/max)*100).toFixed(2) : 0;
  document.getElementById("tPer").innerText = per + "%";

  let pass = document.getElementById("rPass");
  pass.innerText = per>=33? "PASS" : "FAIL";
  pass.style.background = per>=33? "#10b981" : "#ef4444";

  resDiv.style.display = "block";
}

loadSheet();
</script>
</body>
</html>
