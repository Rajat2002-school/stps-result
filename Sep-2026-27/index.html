<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Portal</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', Arial; background: linear-gradient(135deg, #0A2A66 0%, #185a9d 100%); min-height: 100vh; padding: 20px; }

 .container { background: white; padding: 0; border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.3); max-width: 700px; margin: 30px auto; overflow: hidden; }

 .header { background: linear-gradient(90deg, #0A2A66, #FFD700); color: white; text-align: center; padding: 25px; }
 .header.logo { font-size: 50px; }
 .header h2 { font-size: 26px; font-weight: 700; margin-top: 5px; }
 .header p { font-size: 14px; opacity: 0.9; }

 .form-area { padding: 30px; }
    input { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; }
    input:focus { border-color: #0A2A66; outline: none; }

 .btn { width: 100%; padding: 15px; margin: 10px 0; background: linear-gradient(90deg, #0A2A66, #185a9d); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: 600; }
 .btn:hover { transform: translateY(-2px); }
 .print-btn { background: linear-gradient(90deg, #43cea2, #36b08f); }

 .result { margin: 0 30px 30px 30px; padding: 25px; background: #fff; border-radius: 18px; display: none; border: 2px solid #FFD700; animation: fadeIn 0.5s; }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

 .result-title { text-align: center; color: #0A2A66; font-size: 22px; font-weight: 700; margin-bottom: 15px; }
 .info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
 .info-box { background: #f0f5ff; padding: 12px; border-radius: 8px; border-left: 4px solid #0A2A66; }
 .info-box b { color: #0A2A66; display: block; font-size: 12px; }

    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th { background: #0A2A66; color: white; padding: 12px; }
    td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; }
    tr:nth-child(even) { background: #f8f9ff; }

 .summary { display: flex; justify-content: space-around; background: #0A2A66; color: white; padding: 15px; border-radius: 10px; margin-top: 10px; }
 .summary b { font-size: 20px; display: block; }
 .pass { color: #43cea2; font-weight: bold; }
 .fail { color: #ff6b6b; font-weight: bold; }

    @media print {
        body * { visibility: hidden; }
   .result,.result * { visibility: visible; }
   .result { position: absolute; left: 0; top: 0; width: 100%; border: none; margin: 0; }
        button,.form-area,.header { display: none; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">🏫 </div>
        <h2>SUBHASH TAYAL PUBLIC SCHOOL <BR >HANSI</h2>
         <h3> Session - 2026-27</h3>
        <p>Student Result Class X</p>
    </div>

    <div class="form-area">
        <input type="text" id="name" placeholder="👤 Student's Name">
        <input type="text" id="class" placeholder="👨 Class">
        <input type="text" id="roll" placeholder="🎓 Roll no.">
        <button class="btn" onclick="checkResult()">See Your Result</button>
    </div>

    <div id="resultBox" class="result"></div>
    <div style="padding: 0 30px 30px 30px;">
        <button id="printBtn" class="btn print-btn" style="display:none;" onclick="window.print()">🖨️ Result Print करें</button>
    </div>
</div>

<script>
// 👇 YAHAN APNE SABHI BACHO KA DATA DAALO 👇
const students = [
    {
        name: "Rahul",
        roll: "101",
        class: "10th A",
        subjects: { "Hindi": 81, "English": 32, "Maths": 83, "Science": 98, "SST": 80, "Computer": 95 }
    },
    {
        name: "Priya Sharma",
        roll: "102",
        class: "10th A",
        subjects: { "Hindi": 90, "English": 88, "Maths": 95, "Science": 91, "SST": 89, "Computer": 98 }
    },
    {
        name: "Aman Singh",
        roll: "103",
        class: "9th B",
        subjects: { "Hindi": 45, "English": 50, "Maths": 40, "Science": 55, "SST": 48, "Computer": 60 }
    }
];
// 👆 YAHAN TAK DATA DAALO 👆

function checkResult() {
    let name = document.getElementById('name').value.trim().toLowerCase();
    let class = document.getElementById('class').value.trim().toLowerCase();
    let roll = document.getElementById('roll').value.trim();
    let resultBox = document.getElementById('resultBox');
    let printBtn = document.getElementById('printBtn');

    // 3no match karne par hi result dikhega
    let student = students.find(s =>
        s.name.toLowerCase() === name &&
        s.class.toLowerCase() === class &&
        s.roll === roll
    );

    if(student) {
        let total = 0;
        let subCount = Object.keys(student.subjects).length;
        let tableRows = '';

        for(let sub in student.subjects) {
            let marks = student.subjects[sub];
            total += marks;
            tableRows += `<tr><td>${sub}</td><td><b>${marks}</b></td></tr>`;
        }

        let maxMarks = subCount * 100;
        let percentage = (total / maxMarks * 100).toFixed(2);
        let status = percentage >= 33? "PASS" : "FAIL";
        let statusClass = percentage >= 33? "pass" : "fail";

        resultBox.style.display = 'block';
        printBtn.style.display = 'block';

        resultBox.innerHTML = `
            <div class="result-title">📄 Student Result Card</div>
            <div class="info-grid">
                <div class="info-box"><b>STUDENT NAME</b> ${student.name}</div>
                <div class="info-box"><b>Class</b> ${student.class}</div>
                <div class="info-box"><b>ROLL NO</b> ${student.roll}</div>
                <div class="info-box"><b>CLASS</b> ${student.class}</div>
                <div class="info-box"><b>TOTAL</b> ${total}/${maxMarks}</div>
                <div class="info-box"><b>PERCENTAGE</b> ${percentage}%</div>
            </div>
            <table>
                <tr><th>Subject</th><th>Marks Obtained</th></tr>
                ${tableRows}
            </table>
            <div style="text-align:center; margin-top:10px; font-size:20px;">
                Result: <b class="${statusClass}">${status}</b>
            </div>
            <p style="text-align:center; margin-top:15px; font-size:12px; color:#888;">Date: ${new Date().toLocaleDateString('hi-IN')}</p>
        `;
    } else {
        resultBox.style.display = 'block';
        printBtn.style.display = 'none';
        resultBox.innerHTML = `<p style="color:red; text-align:center; font-size:18px; padding:20px;"><b>❌ Record Not Found</b><br>Name, Class Name aur Roll No sahi se check karein</p>`;
    }
}
</script>
</body>
</html>
